# splitfy — a small, portable audio-separation CLI + server.
# src-layout: all application code lives under ``src/splitfy/`` so the package
# can be installed (``pip install -e .``) or run directly from a checkout.
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splitfy-audio-sep"
version = "0.1.0"
description = "Portable four-stem audio separation (YouTube download -> drums / no-drums WAV)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE.md" }
keywords = ["audio", "demucs", "stem-separation", "yt-dlp"]

[project.scripts]
splitfy = "splitfy.run:main"

[tool.setuptools.packages.find]
where = ["src"]

# Make the package importable (bare ``import splitfy.*``) when running tests
# or scripts straight from a checkout without an editable install.
# Pin ruff's ruleset so VS Code (@sumneko/ruff-languageserver) uses the SAME
# checks as the anaconda `ruff` binary — no more editor-vs-CLI disagreement.
# Keep E4/E7/E9/F (the real bug class, e.g. undefined names) ON; drop only the
# line-length/whitespace nits that clutter the editor but aren't bugs.
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "W291", "W293"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
