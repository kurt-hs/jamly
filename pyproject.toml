# jamly — a small, portable audio-separation CLI + server.
# src-layout: all application code lives under ``src/jamly/`` so the package
# can be installed (``pip install -e .``) or run directly from a checkout.
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jamly-audio-sep"
version = "0.1.0"
description = "Portable four-stem audio separation (YouTube download -> drums / no-drums WAV)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE.md" }
keywords = ["audio", "demucs", "stem-separation", "yt-dlp"]

# uv-managed project venv at ``.venv`` (created by `uv sync`). Pure stdlib app,
# so the only test-time dependency is pytest; pin the interpreter for a
# reproducible, portable environment that VS Code can pin via .vscode/settings.json.
[tool.uv]
# Pin the interpreter used to build .venv for a reproducible, portable env.
python-version = "3.13"

[project.scripts]
jamly = "jamly.run:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

# Make the package importable (bare ``import jamly.*``) when running tests
# or scripts straight from a checkout without an editable install.
# Pin ruff's ruleset so VS Code (@sumneko/ruff-languageserver) uses the SAME
# checks as the anaconda `ruff` binary — no more editor-vs-CLI disagreement.
# Keep E4/E7/E9/F (the real bug class, e.g. undefined names) ON; drop only the
# line-length/whitespace nits that clutter the editor but aren't bugs.
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "W291", "W293"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
