# auto-convert — a small, portable audio-separation CLI + server.
# src-layout: all application code lives under ``src/auto_convert/`` so the package
# can be installed (``pip install -e .``) or run directly from a checkout.
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-convert-audio-sep"
version = "0.1.0"
description = "Portable four-stem audio separation (YouTube download -> drums / no-drums WAV)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["audio", "demucs", "stem-separation", "yt-dlp"]

[project.scripts]
auto-convert = "auto_convert.run:main"

[tool.setuptools.packages.find]
where = ["src"]

# Make the package importable (bare ``import auto_convert.*``) when running tests
# or scripts straight from a checkout without an editable install.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
