<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { width:320px; margin:0; font:13px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:#fff;color:#222; padding:14px; }
  h2 { font-size:15px; margin:0 0 10px; color:#0e7eea; }
  label { display:block;font-weight:600;margin-top:8px; }
  input[type=text] { width:100%; box-sizing:border-box;padding:6px;border-radius:4px;border:1px solid #bbb; }
  button { margin-top:12px;padding:7px;border:none;border-radius:4px;background:#0e7eea;color:#fff;cursor:pointer;font-weight:600; }
  .note { font-size:11px;color:#888;margin-top:10px; }
  #ac_status { margin-top:10px;font-size:11px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .badge { display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:11px;padding:0 5px;border-radius:3px;background:#eee;color:#222;min-width:78px; }
  .badge .lbl { text-transform:uppercase;letter-spacing:.4px; }
  .badge.done   { color:#1a7f37; background:#d9eddf; }
  .badge.error  { color:#b71c1c; background:#f9d5d5; }
  .badge.pending{ color:#666;    background:#e0e0e0; }
  .badge.download{ color:#094771; background:#dbeafe; }
  .badge.separate{ color:#5e35b1; background:#ede7f6; }
  .badge.mix    { color:#8a6d3b; background:#f2e8cf; }
</style>
</head>
<body>
<h2>splitfy status — options</h2>
<label for="url">Server URL (where `python -m splitfy.server` listens)</label>
<input id="url" type="text" value="http://127.0.0.1:8765" />
<button id="save">Save</button>
<div class="note">The popup polls this /status endpoint every second and enqueues jobs with POST /add.</div>
<div id="ac_status">server not reachable</div>
<script>
(function () {
  // Shared download/pipeline vocabulary (identical to the popup + CLI): stage -> icon/label.
  var STAGE = {
    idle:     { icon: "\u25cc", label: "IDLE" },
    pending:  { icon: "\u25b0", label: "QUEUED" },
    download: { icon: "\u2b1b", label: "EXTRACTING" },
    separate: { icon: "\u2702\ufe0f", label: "SEPARATING" },
    mix:      { icon: "\U0001F5A4", label: "MIXING" },
    done:     { icon: "\u2714", label: "DONE" },
    error:    { icon: "\u2717", label: "ERROR" },
  };
  function badge(status, title) {
    var s = status || "idle";
    var st = STAGE[s] || STAGE.idle;
    return '<span class="badge ' + (s === "done" ? "done" : s === "error" ? "error" : s) + '">' +
           st.icon + ' <span class="lbl">' + st.label + '</span>' +
           ((title) ? ' \u2014 ' + title : '') + '</span>;
  }
  function counts(body) {
    var p = (body && body.pending == null ? 0 : Math.max(0, body.pending));
    var d = (body && body.done == null ? 0 : Math.max(0, body.done));
    return [p, d];
  }
  function render() {
    if (!chrome.storage || !chrome.storage.local) return;
    chrome.storage.local.get(["ac_status"], function (items) {
      var ac = items && items.ac_status;
      if (!ac) { document.getElementById("ac_status").textContent = "server not reachable"; return; }
      var c = counts(ac);
      var cur = ac.current || {};
      document.getElementById("ac_status").innerHTML = badge(cur.status, cur.title || (cur.watch_id ? cur.watch_id[0] + "\u2026" : '')) +
        '   \u00b7   pending: ' + c[0] + '   done: ' + c[1];
    });
  }
  render();
  chrome.storage.onChanged.addListener(function (changes, area) {
    if (area === "local" && changes.ac_status) { var snap = changes.ac_status.newValue; if (snap) render(); }
  });
  chrome.storage.local.get(["ac_serverUrl"], function (items) {
    var url = items && items.ac_serverUrl || "http://127.0.0.1:8765";
    document.getElementById("url").value = url;
  });
  document.getElementById("save").addEventListener("click", function () {
    chrome.storage.local.set({ ac_serverUrl: document.getElementById("url").value.trim() || "http://127.0.0.1:8765" }, function () {
      alert("Saved.");
    });
  });
})();
</script>
</body>
</html>
