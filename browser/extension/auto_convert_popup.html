<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { width:300px; margin:0; font:13px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:#1e1e1e; color:#e6e6e6; }
  h2 { font-size:14px; margin:8px;color:#4fc3f7; }
  #enqueue { display:flex; flex-direction:column; gap:5px;padding:8px;border-bottom:1px solid #333; }
  #inputs { width:100%; box-sizing:border-box;height:60px; padding:6px; border-radius:4px;border:1px solid #555;background:#252526;color:#fff;font-family:monospace;font-size:12px; }
  #titles { width:100%; box-sizing:border-box;height:28px; padding:4px; border-radius:4px;border:1px solid #555;background:#252526;color:#fff;font-size:11px; }
  button { padding:6px;border:none;border-radius:4px;background:#0e7eea;color:#fff;cursor:pointer;font-weight:600; }
  button:hover { background:#0957b5; }
  #counts { font-size:11px;color:#888;margin-left:6px;white-space:nowrap; }
  #status { color:#ffd54f;font-weight:600;min-height:1.5em;padding-left:6px; }
  #current-title { padding-left:6px;word-break:break-all;color:#fff; }
  ul { list-style:none;margin:6px;padding:0;max-height:240px;overflow:auto; }
  li { display:flex;align-items:center;gap:6px;padding:3px 6px;border-bottom:1px solid #333; }
  .done { color:#4caf50; } .pending { color:#bbb; }
  a { color:inherit;text-decoration:none; } a:hover { text-decoration:underline; }
</style>
</head>
<body>
<h2>auto_convert <span id="counts"></span></h2>
<div id="enqueue">
  <input id="inputs" placeholder="YouTube URLs, one per line (e.g. https://youtu.be/abc)" />
  <input id="titles" placeholder="optional titles (one per line) — leave blank to auto-title from the URL" />
  <div style="display:flex;justify-content:space-between;align-items:center">
    <button id="submit">Enqueue</button>
    <span id="status"></span>
  </div>
</div>
<div id="current-title"></div>
<ul id="list"></ul>

<script>
(function () {
  "use strict";

  function counts(body) {
    var p = (body && body.pending == null ? 0 : Math.max(0, body.pending));
    var d = (body && body.done == null ? 0 : Math.max(0, body.done));
    return [p, d];
  }

  function renderStatus(body) {
    var el = document.getElementById("status");
    if (!body || !body.current || body.current.status === "idle") {
      el.textContent = "server idle — nothing running";
      return;
    }
    el.textContent = "[" + (body.current.stage || "?") + "] " + (body.current.status || "?").toUpperCase();
    var ct = document.getElementById("current-title");
    if (ct) ct.textContent = body.current.title ? body.current.title : "";
  }

  function renderList(body) {
    var list = document.getElementById("list");
    var last_completed = body && body.last_completed || [];
    // completed terminal records from the server
    if (!last_completed.length) {
      list.innerHTML = '<li class="pending">no items yet</li>';
      return;
    }
    var out = "";
    for (var i = 0; i < last_completed.length; i++) {
      var rec = last_completed[i];
      if (!rec || !rec.watch_id) continue;
      var cls = rec.status === "done" ? "done" : "pending";
      var mark = rec.status === "done" ? "\u2714" : "\u2717";
      out += '<li class="' + cls + '">' + mark + ' ' + (rec.title || rec.watch_id) + '</li>';
    }
    list.innerHTML = out;
  }

  function apply(body) {
    var c = counts(body);
    document.getElementById("counts").textContent = "pending: " + c[0] + "   \u00b7   done: " + c[1];
    renderStatus(body);
    renderList(body);
  }

  // restore latest snapshot from storage on load
  chrome.storage.local.get(["ac_status"], function (items) {
    if (items.ac_status) apply(items.ac_status);
  });

  // refresh whenever the SW relays a new /status snapshot through storage
  chrome.storage.onChanged.addListener(function (changes, area) {
    if (area === "local" && changes.ac_status) {
      var snap = changes.ac_status.newValue;
      if (snap) apply(snap);
    }
  });

  // enqueue form -> POST /add via the service worker's shared client
  document.getElementById("submit").addEventListener("click", function () {
    var inputsEl = document.getElementById("inputs");
    var titlesEl = document.getElementById("titles");
    var inputs = inputsEl.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    if (!inputs.length) {
      document.getElementById("status").textContent = "nothing to enqueue";
      return;
    }
    var titles = titlesEl.value.split("\n").map(function (s) { return s.trim(); });
    chrome.runtime.sendMessage({ type: "ac.enqueue", inputs: inputs, titles: titles }, function (resp) {
      if (!chrome.runtime || !chrome.runtime.lastError) {
        document.getElementById("status").textContent = resp && resp.ok ? ("queued " + (resp.resp ? resp.resp.newly_added : inputs.length)) : (resp.error || "enqueue failed");
      } else {
        document.getElementById("status").textContent = chrome.runtime.lastError.message;
      }
    });
  });
})();
</script>
</body>
</html>
